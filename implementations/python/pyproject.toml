[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "osfdata"
version = "0.1.0"
description = "Python bindings for the Open Streaming Format (OSF) — read, write, and inspect .osf and .osfz files."
authors = [{ name = "Optimeas GmbH" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/burkhard154/osf"
Repository = "https://github.com/burkhard154/osf"
Documentation = "https://github.com/burkhard154/osf/tree/main/implementations/python"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "osf._osf"
