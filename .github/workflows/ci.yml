# Continuous integration for the optimeas/osf repository.
#
# Job groups:
#   1. test-rust: cargo test + clippy on Linux. Fast — fail-fast for
#      everything else if this is red.
#   2. test-cpp: configure + build + ctest of the C++ implementation on
#      Linux / macOS / Windows, with warnings-as-errors. Independent of
#      the Rust/Python jobs.
#   3. build-wheels: maturin-action across the four supported
#      (os, target) combinations. Each wheel is pip-installed into
#      a fresh venv and the pytest suite is run against it.
#   4. build-sdist: maturin sdist on Linux.
#   5. summary: aggregator job for branch protection rules.
#
# macOS is arm64-only by design — Intel-macOS runners (macos-13) are
# at end-of-life with deteriorating availability; Intel-macOS users
# install from the sdist. See DECISIONS.md §19.
#
# Trusted Publishing to TestPyPI lives in release.yml (this file
# never publishes anything).
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'implementations/python/**'
      - 'implementations/rust/**'
      - 'implementations/cpp/**'
      - 'implementations/java/**'
      - 'examples/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'implementations/python/**'
      - 'implementations/rust/**'
      - 'implementations/cpp/**'
      - 'implementations/java/**'
      - 'examples/**'
      - '.github/workflows/**'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default permissions: read-only. The publish job in release.yml
# elevates id-token: write where needed.
permissions:
  contents: read

jobs:
  test-rust:
    name: Rust tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementations/rust
      - name: cargo test --all-targets
        working-directory: implementations/rust
        run: cargo test --all-targets --release
      - name: cargo clippy --all-targets -- -D warnings
        working-directory: implementations/rust
        run: cargo clippy --all-targets -- -D warnings

  test-cpp:
    name: C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
      # FetchContent fetches googletest v1.15.2 + zlib 1.3.2 over HTTPS,
      # which works on hosted runners (the local-extract workaround in
      # CLAUDE.md is a developer-host-only issue). OSF_WARNINGS_AS_ERRORS
      # promotes any warning to a build failure on every compiler.
      - name: Configure
        run: >
          cmake -B implementations/cpp/build -S implementations/cpp
          -D CMAKE_BUILD_TYPE=Debug
          -D OSF_WARNINGS_AS_ERRORS=ON
          -D OSF_BUILD_C_API=ON
      - name: Build
        run: cmake --build implementations/cpp/build --config Debug
      - name: Test
        run: ctest --test-dir implementations/cpp/build -C Debug --output-on-failure

  test-java:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: implementations/java
        run: mvn -B -ntp verify

  build-wheels:
    name: Build + test wheel (${{ matrix.os }} / ${{ matrix.target }})
    needs: test-rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
            # QEMU-emulated build: the wheel is aarch64, but the
            # runner host is x86_64, so it cannot pip-install its own
            # output. The build itself is the meaningful signal here;
            # the wheel-install + pytest step is skipped below. The
            # macos-14 / aarch64 entry exercises the same data path
            # natively on a real ARM kernel, so we still have ARM test
            # coverage in the matrix.
            cross: true
          - os: macos-14          # Apple Silicon (macOS arm64-only — see DECISIONS.md §19)
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementations/python

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: implementations/python
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          # Linux aarch64 needs QEMU; maturin-action sets it up
          # automatically when target=aarch64 and os is Linux.
          manylinux: auto

      - name: Install wheel + pytest
        # Cross-built wheels (aarch64 on x86_64 runner) cannot be
        # installed onto the host's Python; skip the install + test
        # step there. The wheel still uploads as an artefact.
        if: ${{ !matrix.cross }}
        shell: bash
        working-directory: implementations/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          python -m pip install --no-index --find-links dist osfdata
          python -m pytest tests/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: implementations/python/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    needs: test-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: implementations/python
          command: sdist
          args: --out dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: implementations/python/dist/*.tar.gz
          if-no-files-found: error

  summary:
    name: CI summary
    needs: [test-rust, test-cpp, test-java, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate results
        run: |
          echo "test-rust:    ${{ needs.test-rust.result }}"
          echo "test-cpp:     ${{ needs.test-cpp.result }}"
          echo "test-java:    ${{ needs.test-java.result }}"
          echo "build-wheels: ${{ needs.build-wheels.result }}"
          echo "build-sdist:  ${{ needs.build-sdist.result }}"
          if [ "${{ needs.test-rust.result }}" != "success" ] \
             || [ "${{ needs.test-cpp.result }}" != "success" ] \
             || [ "${{ needs.test-java.result }}" != "success" ] \
             || [ "${{ needs.build-wheels.result }}" != "success" ] \
             || [ "${{ needs.build-sdist.result }}" != "success" ]; then
            exit 1
          fi
