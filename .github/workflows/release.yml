# Release workflow for the osfdata Python package.
#
# Triggered by a v*-tag push (e.g. `v0.1.0`). Builds the same four-
# platform wheel matrix plus an sdist, then publishes to TestPyPI
# via Trusted Publishing (OIDC, no API tokens).
#
# macOS is arm64-only by design — see DECISIONS.md §19.
#
# Trusted Publishing on TestPyPI is configured for project `osfdata`
# (owner: optimeas, repo: osf, workflow: release.yml). Pushing a v*
# tag triggers a full wheel + sdist build followed by an OIDC-
# authenticated upload — no API tokens involved.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-14          # Apple Silicon (macOS arm64-only — see DECISIONS.md §19)
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementations/python

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: implementations/python
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: implementations/python/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: implementations/python
          command: sdist
          args: --out dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: implementations/python/dist/*.tar.gz
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Tag-only: this job runs only when a v* tag is pushed. The
    # workflow itself is also tag-triggered, but the explicit
    # condition documents intent and protects against accidental
    # invocation via workflow_dispatch on a non-tag ref.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - name: Download all wheel + sdist artefacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
